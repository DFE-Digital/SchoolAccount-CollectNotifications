name: PR Health Checks

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.x"
  MIN_LINE_COVERAGE: "70"
  MSSQL_SA_USER: "sa"
  MSSQL_SA_PASSWORD: "MyStrongPassword123!"
  TEST_RESULTS_DIRECTORY: "TestResults"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build solution
        uses: ./.github/actions/build
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Unit Tests
        uses: ./.github/actions/test
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          project-path: "SchoolAccount.CollectNotifications.Tests.Unit"
          results-directory: "${{ env.TEST_RESULTS_DIRECTORY }}/Unit"
          log-file-name: "unit_test_results.trx"
          no-build: "true"

      - name: Upload Unit Test Results
        if: ${{ !env.ACT && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ${{ env.TEST_RESULTS_DIRECTORY }}/Unit
          retention-days: 1

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "MyStrongPassword123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MyStrongPassword123!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build solution
        uses: ./.github/actions/build
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Ledger Database
        uses: ./.github/actions/setup-ledger-db
        with:
          db-server: "localhost,1433"
          db-user: ${{ env.MSSQL_SA_USER }}
          db-password: ${{ env.MSSQL_SA_PASSWORD }}

      - name: Run Integration Tests
        uses: ./.github/actions/test
        env:
          ConnectionStrings__LedgerDatabase: "Server=localhost,1433;Database=CollectStateLedger;User Id=${{ env.MSSQL_SA_USER }};Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true"
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          project-path: "SchoolAccount.CollectNotifications.Tests.Integration"
          results-directory: "${{ env.TEST_RESULTS_DIRECTORY }}/Integration"
          log-file-name: "integration_test_results.trx"
          no-build: "true"

      - name: Upload Integration Test Results
        if: ${{ !env.ACT && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ${{ env.TEST_RESULTS_DIRECTORY }}/Integration
          retention-days: 1

  coverage-report:
    name: Coverage & Test Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: ${{ !cancelled() }}

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        if: ${{ !env.ACT }}
        uses: actions/checkout@v4

      - name: Download Unit Test Results
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: ${{ env.TEST_RESULTS_DIRECTORY }}/Unit

      - name: Download Integration Test Results
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: ${{ env.TEST_RESULTS_DIRECTORY }}/Integration

      - name: Coverage & Test Report
        if: ${{ !env.ACT }}
        uses: ./.github/actions/coverage-report
        with:
          results-directory: ${{ env.TEST_RESULTS_DIRECTORY }}
          min-line-coverage: ${{ env.MIN_LINE_COVERAGE }}
