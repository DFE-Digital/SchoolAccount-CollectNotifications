name: Collect Notifications Deploy
run-name: Deploy ${{ github.ref_name }} to ${{ inputs.environment }}

# Run from a version tag (e.g. v2026.11.18.1) to deploy that version. Running from main
# deploys main's latest commit. The Environments page shows the tag or commit deployed.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: environment
        required: true
      promote:
        description: When the deploy succeeds, start the deploy to the next environment (dev → preprod → prod)
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/dfe-digital/schoolaccount-collectnotifications

# Jobs that need the token declare their own permissions; everything else gets none.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    permissions:
      contents: read

    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      # Anyone with write access can push a tag, so only deploy commits that are on main
      - name: Check commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$STATUS" != "identical" ] && [ "$STATUS" != "behind" ]; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - name: Resolve image
        id: image
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            IMAGE="$IMAGE_NAME:$GITHUB_REF_NAME"
          else
            IMAGE="$IMAGE_NAME:sha-${GITHUB_SHA::7}"
          fi
          echo "Deploying $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update ACA Job Image
        run: |
          az containerapp job update \
            --subscription ${{ vars.AZURE_SUBSCRIPTION_ID }} \
            --name ${{ vars.CONTAINERAPP_JOB_NAME }} \
            --resource-group ${{ vars.CONTAINERAPP_RESOURCE_GROUP }} \
            --image ${{ steps.image.outputs.image }}

      - name: Summary
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE: ${{ steps.image.outputs.image }}
          JOB: ${{ vars.CONTAINERAPP_JOB_NAME }}
        run: |
          echo "Deployed \`$IMAGE\` to **$ENVIRONMENT** as the image for job \`$JOB\`" >> "$GITHUB_STEP_SUMMARY"

  # Each environment is its own run, so a failed deploy can be re-run on its own
  promote:
    name: Start next deploy
    needs: deploy
    if: ${{ inputs.promote && inputs.environment != 'prod' }}
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Start deploy to next environment
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ inputs.environment }}
        run: |
          case "$CURRENT" in
            dev) NEXT=preprod ;;
            preprod) NEXT=prod ;;
            *) echo "::error::No environment after $CURRENT"; exit 1 ;;
          esac
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f environment="$NEXT" -f promote=true
          echo "Started deploy of $GITHUB_REF_NAME to **$NEXT**" >> "$GITHUB_STEP_SUMMARY"
