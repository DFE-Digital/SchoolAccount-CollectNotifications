name: Collect Notifications Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: "10.x"
  MIN_LINE_COVERAGE: "85"
  SOLUTION_FILE: SchoolAccount-CollectNotifications.slnx
  MAIN_BRANCH: refs/heads/main
  IMAGE_NAME: ghcr.io/dfe-digital/schoolaccount-collectnotifications
  CONTAINERAPP_RESOURCE_GROUP: s268d01rg-uks-sa-ace
  CONTAINERAPP_NAME: schoolaccount-collectnotifications-app
  LEDGER_DATABASE_REPOSITORY: DFE-Digital/SchoolAccount-CollectStateLedgerDatabase
  LEDGER_DATABASE_REF: notification-tables
  LEDGER_DATABASE_IMAGE: mcr.microsoft.com/mssql/server:2022-latest
  LEDGER_DATABASE_PASSWORD: "MyStrongPassword123!"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      checks: write
      pull-requests: write

    # The env context is not available here, so the image and password are repeated
    # from the env block above.
    services:
      ledger-database:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "MyStrongPassword123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Check out the ledger database schema
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LEDGER_DATABASE_REPOSITORY }}
          ref: ${{ env.LEDGER_DATABASE_REF }}
          path: ledger-database

      - name: Apply the ledger database schema
        run: |
          for script in database tables stored-procedures; do
            docker run --rm --network host \
              --volume "${{ github.workspace }}/ledger-database/sql:/sql:ro" \
              --entrypoint /opt/mssql-tools18/bin/sqlcmd \
              ${{ env.LEDGER_DATABASE_IMAGE }} \
              -C -b -S localhost,1433 -U sa -P "${{ env.LEDGER_DATABASE_PASSWORD }}" -d master -i "/sql/$script.sql"
          done

      - name: Test
        env:
          "ConnectionStrings:LedgerDatabase": Server=localhost,1433;Database=CollectStateLedger;User Id=sa;Password=${{ env.LEDGER_DATABASE_PASSWORD }};TrustServerCertificate=true
        run: dotnet test ${{ env.SOLUTION_FILE }} --configuration Release --no-restore --no-build -- --report-trx --coverage --coverage-output-format cobertura --coverage-settings ${{ github.workspace }}/coverage.config

      - name: Test report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          files: "TestResults/*.trx"

      - name: Merge coverage reports and enforce threshold
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: "TestResults/*.cobertura.xml"
          targetdir: TestResults/Merged
          reporttypes: "Cobertura;MarkdownSummaryGithub"
          customSettings: "minimumCoverageThresholds:lineCoverage=${{ env.MIN_LINE_COVERAGE }}"

      - name: Write coverage job summary
        if: ${{ !cancelled() }}
        run: cat TestResults/Merged/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add coverage comment to PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: TestResults/Merged/SummaryGithub.md

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == env.MAIN_BRANCH }}
            type=ref,event=branch

      - name: Get SHA image tag
        id: image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | grep "sha-" | head -n 1)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build & Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: SchoolAccount.CollectNotifications/Dockerfile
          target: final
          push: ${{ github.ref == env.MAIN_BRANCH }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Publish
        run: dotnet publish ${{ env.SOLUTION_FILE }} --configuration Release --no-restore --no-build

      - name: Azure Login
        if: github.event_name == 'push' && github.ref == env.MAIN_BRANCH
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update ACA Image
        if: github.event_name == 'push' && github.ref == env.MAIN_BRANCH
        run: |
          az containerapp update \
            --name ${{ env.CONTAINERAPP_NAME }} \
            --resource-group ${{ env.CONTAINERAPP_RESOURCE_GROUP }} \
            --image ${{ steps.image.outputs.image }}