name: Collect Notifications Build and Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: environment
        required: true
        default: dev
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: "10.x"
  MIN_LINE_COVERAGE: "85"
  SOLUTION_FILE: SchoolAccount-CollectNotifications.slnx
  MAIN_BRANCH: refs/heads/main
  IMAGE_NAME: ghcr.io/dfe-digital/schoolaccount-collectnotifications
  LEDGER_DATABASE_PASSWORD: "MyStrongPassword123!"

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    permissions:
      contents: read
      packages: write
      checks: write
      pull-requests: write

    # The env context is not available here, so the password is repeated from the env
    # block above.
    services:
      ledger-database:
        image: ghcr.io/dfe-digital/schoolaccount-collectstateledgerdatabase:latest
        env:
          MSSQL_SA_PASSWORD: "MyStrongPassword123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "[ -f /tmp/schema-applied ] && /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -d CollectStateLedger -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute CalVer & Metadata
        id: versioning
        run: |
          YEAR=$(date -u +'%Y')
          MONTH=$(date -u +'%-m')
          START_OF_MONTH=$(date -u +'%Y-%m-01 00:00:00')

          REVISION=$(git rev-list --count --since="$START_OF_MONTH" HEAD)
          [ "$REVISION" -eq 0 ] && REVISION=1

          CALVER="${YEAR}.${MONTH}.${REVISION}"
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          CONVENIENCE_TAG="${CALVER}-${SHORT_SHA}"

          echo "calver=$CALVER" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "convenience_tag=$CONVENIENCE_TAG" >> $GITHUB_OUTPUT
          echo "informational_version=${CALVER}+${SHORT_SHA}" >> $GITHUB_OUTPUT

          echo "Computed Version: $CALVER ($CONVENIENCE_TAG)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Build
        run: >
          dotnet build ${{ env.SOLUTION_FILE }}
          --configuration Release
          --no-restore
          -p:Version=${{ steps.versioning.outputs.calver }}
          -p:InformationalVersion=${{ steps.versioning.outputs.informational_version }}

      - name: Test
        env:
          "Census:ConnectionString": Server=localhost,1433;Database=CollectStateLedger;User Id=sa;Password=${{ env.LEDGER_DATABASE_PASSWORD }};TrustServerCertificate=true
        run: dotnet test ${{ env.SOLUTION_FILE }} --configuration Release --no-restore --no-build -- --report-trx --coverage --coverage-output-format cobertura --coverage-settings ${{ github.workspace }}/coverage.config

      - name: Test report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          files: "TestResults/*.trx"

      - name: Merge coverage reports and enforce threshold
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: "TestResults/*.cobertura.xml"
          targetdir: TestResults/Merged
          reporttypes: "Cobertura;MarkdownSummaryGithub"
          customSettings: "minimumCoverageThresholds:lineCoverage=${{ env.MIN_LINE_COVERAGE }}"

      - name: Write coverage job summary
        if: ${{ !cancelled() }}
        run: cat TestResults/Merged/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add coverage comment to PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: TestResults/Merged/SummaryGithub.md

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.versioning.outputs.calver }}
            type=raw,value=${{ steps.versioning.outputs.convenience_tag }}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == env.MAIN_BRANCH }}
            type=ref,event=branch

      - name: Get primary image tag
        id: image
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:${{ steps.versioning.outputs.convenience_tag }}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build & Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: SchoolAccount.CollectNotifications/Dockerfile
          target: final
          push: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == env.MAIN_BRANCH) }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.versioning.outputs.calver }}
            INFORMATIONAL_VERSION=${{ steps.versioning.outputs.informational_version }}

      - name: Publish
        run: >
          dotnet publish ${{ env.SOLUTION_FILE }}
          --configuration Release
          --no-restore
          --no-build
          -p:Version=${{ steps.versioning.outputs.calver }}
          -p:InformationalVersion=${{ steps.versioning.outputs.informational_version }}

  deploy:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update ACA Job Image
        run: |
          az containerapp job update \
            --subscription ${{ vars.AZURE_SUBSCRIPTION_ID }} \
            --name ${{ vars.CONTAINERAPP_JOB_NAME }} \
            --resource-group ${{ vars.CONTAINERAPP_RESOURCE_GROUP }} \
            --image ${{ needs.build.outputs.image }}
