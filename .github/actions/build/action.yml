name: "Build .NET Solution"
description: "Restores dependencies and builds the .NET solution"

inputs:
  dotnet-version:
    description: ".NET Version"
    type: string
    required: true
  configuration:
    description: "Build configuration (e.g. Debug, Release)"
    required: false
    default: "Release"

runs:
  using: "composite"
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        
    - name: Cache NuGet
      if: ${{ !env.ACT }}
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: nuget-
        
    - name: Restore dependencies
      shell: bash
      run: dotnet restore

    - name: Build solution
      shell: bash
      run: dotnet build --configuration ${{ inputs.configuration }} --no-restore
